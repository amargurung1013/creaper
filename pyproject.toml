[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crepear"
version = "0.1.0"
description = "FinOps infrastructure auditing and automated zombie resource cleanup CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "docker>=7.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
crepear = "crepear.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"